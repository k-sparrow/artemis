name: celery-ingestion-project

x-common-env: &common-environment
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  db:
    image: postgres:14-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_USER=${DATABASE_USERNAME:-postgres}
      - POSTGRES_DB=${DATABASE_NAME:-ingestion}
  redis:
    image: redis:6.2-alpine
    expose:
      - 6379
  monitor:
    image: mher/flower:2.0.1
    environment: *common-environment
    depends_on:
      - backend
      - redis
      - worker
    ports:
      - 5555:5555
      

  backend:
    image: celery-ingestion/backend:latest
    depends_on:
      - db
    environment:
      <<: *common-environment
      DATABASE_HOSTNAME: db
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-venus}
    ports:
      - 9002:9002

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  worker:
    image: celery-ingestion/worker:latest
    environment: *common-environment
    depends_on:
      - backend
      - redis

  docling-inference:
    image: ghcr.io/aidotse/docling-inference:latest
    ports:
      - 8087:8080
    environment:
      - NUM_WORKERS=2
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ocr_cache:/root/.EasyOCR
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  db-data:
  hf_cache:
  ocr_cache: