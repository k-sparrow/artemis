name: "artemis"
x-jwt-common: &jwt-common
  JWT_ISS: &jwt_iss "0b39e2ee-40b5-42c4-ae84-0de05c8dd8d2"
  # TODO: replace this with a real secret
  JWT_SECRET: &jwt_secret "DONOTUSE"
  JWT_ALGORITHM: &jwt_alg "HS256"
x-kong-config: &kong-env-common
  KONG_DATABASE: postgres
  KONG_PG_HOST: kong-ee-database
  KONG_PG_DATABASE: kong
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: kong
x-minio-common: &minio-common
  image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
  command: server --console-address ":9090" /mnt/data
  expose:
    - "9000"
    - "9090"
  ports:
    - 9000:9000
    - 9090:9090
  environment:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
    MINIO_VOLUMES: "/mnt/data"
    MINIO_NOTIFY_KAFKA_ENABLE_ARTEMIS: "on"
    MINIO_NOTIFY_KAFKA_BROKERS_ARTEMIS: broker:9092
    MINIO_NOTIFY_KAFKA_TOPIC_ARTEMIS: artemis.ingestion.storage.s3
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 5s
    timeout: 5s
    retries: 5
services:
  # ---------------------------------------------------------------------------
  # Infra
  # ---------------------------------------------------------------------------
  minio:
    profiles: [infra]
    !!merge <<: *minio-common
    hostname: minio
    volumes:
      - s3-storage:/mnt/data
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - default
  vectorstore:
    profiles: [infra]
    image: qdrant/qdrant:v1.17-unprivileged
    healthcheck:
      # https://github.com/qdrant/qdrant/issues/4250#issuecomment-3145007055
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 30s
      retries: 5
    volumes:
      - qdrant-vectorstore:/qdrant/storage
    environment:
      - RUN_MODE=dev
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__LOG_LEVEL=INFO
    ports:
      - 6333:6333
    expose:
      - "6333"
    networks:
      - default
  postgres:
    profiles: [infra]
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "documents"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db-storage:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_USER=postgres
      - POSTGRES_DB=documents
      - PGDATA=/var/lib/postgresql/data
    command: |
      postgres
      -c wal_level=logical
      -c hot_standby=on
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby_feedback=on
    networks:
      - default
  artemis-db-migrations:
    profiles: [infra]
    image: artemis/db-migrations:dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_DB_URL: "postgresql+psycopg://postgres:testpass@postgres:5432/documents"
    networks:
      - default
  rabbitmq:
    profiles: [infra]
    image: rabbitmq:4.1.2-management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-artemis}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-artemis}
      RABBITMQ_DEFAULT_VHOST: artemis
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 15s
      retries: 5
    networks:
      - default
  broker:
    profiles: [infra]
    image: apache/kafka:4.0.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:19092"
      - "9097:9097"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,EXTERNAL://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: INTERNAL://broker:9092,CONTROLLER://broker:29093,EXTERNAL://0.0.0.0:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka0 -Dcom.sun.management.jmxremote.rmi.port=9997
      KAFKA_CREATE_TOPICS: "_connect-configs,_connect-offsets,_connect-status"
    healthcheck:
      # EXTERNAL listener is the only one bound to 0.0.0.0 (port 19092 inside the container)
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - default
  schemaregistry:
    profiles: [infra]
    image: confluentinc/cp-schema-registry:6.0.0
    restart: always
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schemaregistry
      SCHEMA_REGISTRY_LISTENERS: "http://schemaregistry:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:9092
    networks:
      - default
  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend-main:
    profiles: [backend]
    image: artemis/backend-main:dev
    depends_on:
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: wget http://localhost:10001/health || exit 1
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 30s
    environment:
      SQL_DB_USER: postgres
      SQL_DB_PASSWORD: testpass
      SQL_DB_HOST: postgres
      SQL_DB_PORT: 5432
      SQL_DB_DATABASE: documents
      SQL_DRIVER: postgresql+asyncpg
      JWT_SECRET: *jwt_secret
      JWT_ISS: *jwt_iss
      JWT_ALGORITHM: *jwt_alg
    expose:
      - 10001
    ports:
      - "10001:10001"
    networks:
      - default
  backend-main-chat:
    profiles: [backend]
    image: artemis/backend-chat:dev
    depends_on:
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
      backend-indexing-ingestion:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: wget http://localhost:10010/health || exit 1
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 30s
    environment:
      SQL_DB_USER: postgres
      SQL_DB_PASSWORD: testpass
      SQL_DB_HOST: postgres
      SQL_DB_PORT: 5432
      SQL_DB_DATABASE: documents
      SQL_DRIVER: postgresql+asyncpg
      JWT_SECRET: *jwt_secret
      JWT_ISS: *jwt_iss
      JWT_ALGORITHM: *jwt_alg
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:8b-instruct-fp16
      RETRIEVER_SERVICE_BASE_URL: http://backend-indexing-ingestion:10000
      RETRIEVER_SERVICE_HEALTH_ENDPOINT: /health
      RETRIEVER_SERVICE_RETRIEVE_ENDPOINT: /retrieve
      CHAT_HISTORY_PLACEHOLDER: "chat_history"
    expose:
      - 10010
    ports:
      - "10011:10010"
    networks:
      - default
  backend-storage:
    profiles: [backend, enterprise]
    image: artemis/backend-storage:dev
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/7000 && printf 'GET /health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      SQL_DB_URL: "postgresql+asyncpg://postgres:testpass@postgres:5432/documents"
      S3_ENDPOINT_URL: "minio:9000"
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ARTEMIS_BUCKET: artemis
      S3_ARTEMIS_BUCKET_KAFKA_EVENT: ARTEMIS
    expose:
      - "7000"
    ports:
      - "7000:7000"
    networks:
      - default
  backend-indexing-controller-celery-worker:
    profiles: [backend, enterprise]
    image: artemis/backend-controller-worker:latest
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: artemis
      RABBITMQ_PASSWORD: artemis
      RABBITMQ_VHOST: artemis
      SQL_DB_HOST: postgres
      SQL_DB_PORT: 5432
      SQL_DB_USER: postgres
      SQL_DB_PASSWORD: testpass
      SQL_DB_DATABASE: documents
      SQL_DRIVER: postgresql+psycopg
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: false
      EXCHANGE_NAME: ingestion_test0
      INGESTION_SERVICE_URL: http://backend-indexing-ingestion:10000
      PARSING_SERVICE_URL: http://backend-parsing:10001
    networks:
      - default
  backend-parsing:
    profiles: [backend, enterprise]
    image: artemis/backend-parsing:dev
    depends_on:
      docling-serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/10001 && printf 'GET /health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      DOCLING_SERVE_URI: "http://docling-serve:5001"
      LOADER_TYPE: "docling"
    expose:
      - "10001"
    ports:
      - "10003:10001"
    networks:
      - default
  backend-indexing-ingestion:
    profiles: [backend, enterprise]
    image: artemis/backend-indexing:dev
    depends_on:
      vectorstore:
        condition: service_healthy
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/10000 && printf 'GET /health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      QDRANT_HOST_URL: "http://vectorstore:6333"
      QDRANT_COLLECTION_NAME: "artemis"
      TEI_HOST_URL: "${TEI_HOST_URL:-http://tei:80}"
      RETRIEVAL_MODE: "${RETRIEVAL_MODE:-dense}"
      COLBERT_HOST_URL: "${COLBERT_HOST_URL:-http://colbert:8000}"
      COLBERT_MODEL_NAME: "${COLBERT_MODEL_NAME:-jinaai/jina-colbert-v2}"
      COLBERT_RERANKER_URL: "${COLBERT_RERANKER_URL:-}"
      COLBERT_MAX_TOKENS_PER_DOC: "${COLBERT_MAX_TOKENS_PER_DOC:-511}"
      SQL_DB_USER: "postgres"
      SQL_DB_PASSWORD: "testpass"
      SQL_DB_HOST: "postgres"
      SQL_DB_PORT: "5432"
      SQL_DB_DATABASE: "documents"
      SQL_DRIVER: "postgresql+asyncpg"
      DEBUG: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "10000"
    ports:
      - "10000:10000"
    networks:
      - default
  # ---------------------------------------------------------------------------
  # Enterprise
  # ---------------------------------------------------------------------------
  backend-enterprise-data-sources:
    profiles: [enterprise]
    image: artemis/backend-data-sources:dev
    depends_on:
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
      kafka-connect:
        condition: service_healthy
      backend-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9500 && printf 'GET /health/liveness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      SQL_DB_URL: "postgresql+asyncpg://postgres:testpass@postgres:5432/documents"
      KAFKA_CONNECT_URL: "http://kafka-connect:8083"
      STORAGE_SERVICE_URL: "http://backend-storage:7000"
    expose:
      - "9500"
    ports:
      - "9500:9500"
    networks:
      - default
  artemis-ksqldb-init:
    profiles: [backend, enterprise]
    image: artemis/ksqldb-init:latest
    container_name: artemis-ksqldb-init
    depends_on:
      ksqldb-server:
        condition: service_healthy
    restart: "no"
    environment:
      KSQLDB_SERVER_URL: http://ksqldb-server:8088
    networks:
      - default
  ksqldb-enterprise-init:
    profiles: [enterprise]
    image: artemis/ksqldb-enterprise-init:latest
    container_name: ksqldb-enterprise-init
    depends_on:
      ksqldb-server:
        condition: service_healthy
      artemis-ksqldb-init:
        condition: service_completed_successfully
    restart: "no"
    environment:
      KSQLDB_SERVER_URL: http://ksqldb-server:8088
    networks:
      - default
  artemis-kafka-connect-init:
    profiles: [enterprise]
    image: artemis/cp-kafka-connect-init:latest
    container_name: artemis-kafka-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
      ksqldb-enterprise-init:
        condition: service_completed_successfully
    restart: "no"
    environment:
      KAFKA_CONNECT_CLUSTER_URI: http://kafka-connect:8083
    networks:
      - default
  backend-enterprise-intake:
    profiles: [enterprise]
    image: artemis/backend-enterprise-intake:dev
    depends_on:
      backend-storage:
        condition: service_healthy
    volumes:
      - ${ARTEMIS_WATCH_DIR:-/tmp/artemis-e2e-watch}:/watch:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/liveness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      KAFKA_CONNECT_URL: "http://kafka-connect:8083"
      STORAGE_SERVICE_URL: "http://backend-storage:7000"
      INTAKE_URL: "http://backend-enterprise-intake:9000/intake"
    expose:
      - "9000"
    ports:
      - "9001:9000"
    networks:
      - default
  kafka-connect:
    profiles: [enterprise]
    image: artemis/cp-kafka-connect:latest
    container_name: kafka-connect
    depends_on:
      - broker
      - schemaregistry
    volumes:
      - ${ARTEMIS_WATCH_DIR:-/tmp/artemis-e2e-watch}:/watch:ro
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "broker:9092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schemaregistry:8081"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_LOG4J_APPENDER_STDOUT_LAYOUT_CONVERSIONPATTERN: "[%d] %p %X{connector.context}%m (%c:%L)%n"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/data/connect-jars
    networks:
      - default
  ksqldb-server:
    profiles: [enterprise, backend]
    image: confluentinc/cp-ksqldb-server:7.9.1
    hostname: ksqldb-server
    container_name: ksqldb-server
    depends_on:
      - broker
      - kafka-connect
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/healthcheck || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      KSQL_CONFIG_DIR: "/etc/ksql"
      KSQL_BOOTSTRAP_SERVERS: "broker:9092"
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: "http://0.0.0.0:8088"
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0
      KSQL_KSQL_SCHEMA_REGISTRY_URL: "http://schemaregistry:8081"
      KSQL_KSQL_CONNECT_URL: "http://kafka-connect:8083"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
    networks:
      - default
  # ---------------------------------------------------------------------------
  # AI
  # ---------------------------------------------------------------------------
  docling-serve:
    profiles: [ai]
    image: "ghcr.io/docling-project/docling-serve-cu126:main"
    container_name: docling-serve
    ports:
      - "5001:5001"
    healthcheck:
      test: wget http://localhost:5001/health || exit 1
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 30s
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_MAX_SYNC_WAIT: 12000
      NVIDIA_VISIBLE_DEVICES: "all" # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/docker-specialized.html
    deploy: # This section is for compatibility with Swarm
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    restart: always
    networks:
      - default
  tei:
    profiles: [ai-tei]
    image: "ghcr.io/huggingface/text-embeddings-inference:1.5"
    command: --model-id BAAI/bge-large-en-v1.5
    container_name: tei
    ports:
      - "11435:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 90s
    networks:
      - default
  colbert:
    profiles: [ai-colbert]
    image: "vllm/vllm-openai:v0.20.2" # ColBERT late-interaction model
    command:
      - jinaai/jina-colbert-v2
      - --pooler-config.task
      - token_embed
      - --hf-overrides
      - '{"architectures": ["ColBERTJinaRobertaModel"]}'
      - --trust-remote-code
    container_name: colbert
    shm_size: "10g"
    ipc: host
    ports:
      - "11436:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 300s
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro
    deploy: # This section is for compatibility with Swarm
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - default
  # ---------------------------------------------------------------------------
  # Dev-tools (development and testing only)
  # ---------------------------------------------------------------------------
  pgadmin:
    profiles: [dev-tools]
    container_name: pgadmin
    image: dpage/pgadmin4:8.13.0
    restart: unless-stopped
    ports:
      - 5444:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=dkabely@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
  kafkacat:
    profiles: [dev-tools]
    image: confluentinc/cp-kafkacat
    command: sleep infinity
    networks:
      - default
  kafka-ui:
    profiles: [dev-tools, kafka-ui]
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "18080:8080"
    depends_on:
      - broker
      - schemaregistry
      - kafka-connect
    environment:
      KAFKA_CLUSTERS_0_NAME: artemis
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:9092"
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schemaregistry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: broker
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb-server:8088
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - default
  ksqldb-cli:
    profiles: [dev-tools]
    image: artemis/ksqldb-cli:latest
    container_name: ksqldb-cli
    environment:
      KSQLDB_SERVER_URL: http://ksqldb-server:8088
    depends_on:
      - broker
      - kafka-connect
      - ksqldb-server
    tty: true
    networks:
      - default
  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    profiles: [frontend]
    image: artemis/frontend:latest
    restart: unless-stopped
    depends_on:
      kong-cp:
        condition: service_healthy
    healthcheck:
      test: wget http://localhost:8501/healthz || exit 1
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 30s
    expose:
      - "8501"
    ports:
      - "8511:8501"
    environment:
      BACKEND_BASE_URL: http://kong-cp:8000
      BACKEND_AUTH_ENDPOINT: /auth
      BACKEND_STORAGE_ENDPOINT: /storage
      BACKEND_CHAT_ENDPOINT: /chat
    networks:
      - default
  # ---------------------------------------------------------------------------
  # API Gateway (Kong)
  # ---------------------------------------------------------------------------
  kong-ee-database:
    profiles: [gateway]
    container_name: kong-ee-database
    image: postgres:latest
    restart: on-failure
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    networks:
      - kong-ee-net
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 10s
      retries: 10
    expose:
      - "5432"
  kong-bootstrap:
    profiles: [gateway]
    image: "${GW_IMAGE:-kong/kong-gateway:3.11.0.2}"
    container_name: kong-bootstrap
    networks:
      - default
      - kong-ee-net
    depends_on:
      kong-ee-database:
        condition: service_healthy
    restart: on-failure
    environment:
      !!merge <<: *kong-env-common
      KONG_PASSWORD: handyshake
    command: kong migrations bootstrap
  kong-cp:
    profiles: [gateway]
    image: "${GW_IMAGE:-kong/kong-gateway:3.11.0.2}"
    container_name: kong-cp
    restart: on-failure
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - default
      - kong-ee-net
    environment:
      !!merge <<: *kong-env-common
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl
      KONG_ADMIN_GUI_URL: http://${GW_HOST:-localhost}:8002
      KONG_PASSWORD: handyshake
    depends_on:
      kong-bootstrap:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
      - "8002:8002"
      - "8445:8445"
  api-gateway-connect-init:
    profiles: [gateway]
    image: artemis/api-gateway-connect-init:latest
    depends_on:
      kong-bootstrap:
        condition: service_completed_successfully
      kong-cp:
        condition: service_healthy
      backend-storage:
        condition: service_healthy
    networks:
      - kong-ee-net
    environment:
      KONG_CP_ADMIN_API: http://kong-cp:8001
      BACKEND_AUTH_URL: http://backend-main:10001
      BACKEND_STORAGE_URL: http://backend-storage:7000
      BACKEND_CHAT_URL: http://backend-main-chat:10010
      BACKEND_CATALOG_URL: http://backend-indexing-ingestion:10000/catalog
      JWT_SECRET: *jwt_secret
      JWT_ISS: *jwt_iss
      JWT_ALGORITHM: *jwt_alg
networks:
  default:
    driver: bridge
  kong-ee-net:
    driver: bridge
volumes:
  qdrant-vectorstore:
  db-storage:
  s3-storage:
  kong_db_data: {}
