# ============================================================================
# GENERATED — do not edit. Source: tools/docker/docker-compose.tmpl.yaml
# Release/staging variant: artemis images pinned to ${ARTEMIS_VERSION},
# dev-tools removed, gateway-only ingress.
#
#   ARTEMIS_VERSION=v1.0.0-alpha.2 docker compose \
#     -f deployment/docker/docker-compose.release.yaml --profile <p> up -d
#
# WARNING: still carries the template's DEV secrets/passwords — override them
# (JWT_SECRET, MinIO/Postgres creds) before any non-staging use.
# ============================================================================
name: "artemis"
x-jwt-common: &jwt-common
  JWT_ISS: &jwt_iss "0b39e2ee-40b5-42c4-ae84-0de05c8dd8d2"
  # TODO: replace this with a real secret
  JWT_SECRET: &jwt_secret "DONOTUSE"
  JWT_ALGORITHM: &jwt_alg "HS256"
x-minio-common: &minio-common
  image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
  command: server --console-address ":9090" /mnt/data
  expose:
    - "9000"
    - "9090"
  environment:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
    MINIO_VOLUMES: "/mnt/data"
    MINIO_NOTIFY_KAFKA_ENABLE_ARTEMIS: "on"
    MINIO_NOTIFY_KAFKA_BROKERS_ARTEMIS: broker:9092
    MINIO_NOTIFY_KAFKA_TOPIC_ARTEMIS: artemis.ingestion.storage.s3
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 5s
    timeout: 5s
    retries: 5
services:
  # ---------------------------------------------------------------------------
  # Infra
  # ---------------------------------------------------------------------------
  minio:
    profiles: [infra]
    !!merge <<: *minio-common
    hostname: minio
    volumes:
      - s3-storage:/mnt/data
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - default
  vectorstore:
    profiles: [infra]
    image: qdrant/qdrant:v1.17-unprivileged
    healthcheck:
      # https://github.com/qdrant/qdrant/issues/4250#issuecomment-3145007055
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 30s
      retries: 5
    volumes:
      - qdrant-vectorstore:/qdrant/storage
    environment:
      - RUN_MODE=dev
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__LOG_LEVEL=INFO
    expose:
      - "6333"
    networks:
      - default
  postgres:
    profiles: [infra]
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "documents"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db-storage:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_USER=postgres
      - POSTGRES_DB=documents
      - PGDATA=/var/lib/postgresql/data
    command: |
      postgres
      -c wal_level=logical
      -c hot_standby=on
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby_feedback=on
    networks:
      - default
  artemis-db-migrations:
    profiles: [infra]
    image: artemis/db-migrations:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_DB_URL: "postgresql+psycopg://postgres:testpass@postgres:5432/documents"
    networks:
      - default
  rabbitmq:
    profiles: [infra]
    image: rabbitmq:4.1.2-management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-artemis}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-artemis}
      RABBITMQ_DEFAULT_VHOST: artemis
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 15s
      retries: 5
    configs:
      - source: rabbitmq-conf
        target: /etc/rabbitmq/rabbitmq.conf
    networks:
      - default
  broker:
    profiles: [infra]
    image: apache/kafka:4.0.0
    hostname: broker
    container_name: broker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,EXTERNAL://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: INTERNAL://broker:9092,CONTROLLER://broker:29093,EXTERNAL://0.0.0.0:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka0 -Dcom.sun.management.jmxremote.rmi.port=9997
      KAFKA_CREATE_TOPICS: "_connect-configs,_connect-offsets,_connect-status"
    healthcheck:
      # EXTERNAL listener is the only one bound to 0.0.0.0 (port 19092 inside the container)
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - default
  schemaregistry:
    profiles: [infra]
    image: confluentinc/cp-schema-registry:6.0.0
    restart: always
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schemaregistry
      SCHEMA_REGISTRY_LISTENERS: "http://schemaregistry:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:9092
    networks:
      - default
  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend-storage:
    profiles: [backend]
    image: artemis/backend-storage:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/7000 && printf 'GET /health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      SQL_DB_URL: "postgresql+asyncpg://postgres:testpass@postgres:5432/documents"
      S3_ENDPOINT_URL: "minio:9000"
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ARTEMIS_BUCKET: artemis
      S3_ARTEMIS_BUCKET_KAFKA_EVENT: ARTEMIS
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    expose:
      - "7000"
    networks:
      - default
  backend-controller-parse-worker:
    profiles: [backend]
    image: artemis/backend-controller-worker:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    command: ["--queues", "artemis.ingestion.parse", "--concurrency", "3", "--prefetch-multiplier", "1"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: artemis
      RABBITMQ_PASSWORD: artemis
      RABBITMQ_VHOST: artemis
      SQL_DB_HOST: postgres
      SQL_DB_PORT: 5432
      SQL_DB_USER: postgres
      SQL_DB_PASSWORD: testpass
      SQL_DB_DATABASE: documents
      SQL_DRIVER: postgresql+psycopg
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: false
      EXCHANGE_NAME: ingestion_test0
      INGESTION_SERVICE_URL: http://backend-indexing-ingestion:10000
      PARSING_SERVICE_URL: http://backend-parsing:10001
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    networks:
      - default
  backend-controller-index-worker:
    profiles: [backend]
    image: artemis/backend-controller-worker:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    command: ["--queues", "artemis.ingestion.index", "--concurrency", "1", "--prefetch-multiplier", "1"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: artemis
      RABBITMQ_PASSWORD: artemis
      RABBITMQ_VHOST: artemis
      SQL_DB_HOST: postgres
      SQL_DB_PORT: 5432
      SQL_DB_USER: postgres
      SQL_DB_PASSWORD: testpass
      SQL_DB_DATABASE: documents
      SQL_DRIVER: postgresql+psycopg
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: false
      EXCHANGE_NAME: ingestion_test0
      INGESTION_SERVICE_URL: http://backend-indexing-ingestion:10000
      PARSING_SERVICE_URL: http://backend-parsing:10001
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    networks:
      - default
  backend-parsing:
    profiles: [backend]
    image: artemis/backend-parsing:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    depends_on:
      docling-serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/10001 && printf 'GET /health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      DOCLING_SERVE_URI: "http://docling-serve:5001"
      LOADER_TYPE: "docling"
      # Claim-check: reads input by reference and writes the parse artifact.
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: false
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    expose:
      - "10001"
    networks:
      - default
  backend-indexing-ingestion:
    profiles: [backend]
    image: artemis/backend-indexing:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    restart: on-failure
    depends_on:
      vectorstore:
        condition: service_healthy
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
      tei:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/10000 && printf 'GET /health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      QDRANT_HOST_URL: "http://vectorstore:6333"
      QDRANT_COLLECTION_NAME: "artemis"
      TEI_HOST_URL: "${TEI_HOST_URL:-http://tei:80}"
      RETRIEVAL_MODE: "${RETRIEVAL_MODE:-dense}"
      COLBERT_HOST_URL: "${COLBERT_HOST_URL:-http://colbert:8000}"
      COLBERT_MODEL_NAME: "${COLBERT_MODEL_NAME:-jinaai/jina-colbert-v2}"
      COLBERT_RERANKER_URL: "${COLBERT_RERANKER_URL:-}"
      COLBERT_MAX_TOKENS_PER_DOC: "${COLBERT_MAX_TOKENS_PER_DOC:-511}"
      SQL_DB_USER: "postgres"
      SQL_DB_PASSWORD: "testpass"
      SQL_DB_HOST: "postgres"
      SQL_DB_PORT: "5432"
      SQL_DB_DATABASE: "documents"
      SQL_DRIVER: "postgresql+asyncpg"
      # Claim-check: reads the parse artifact by reference (BlobRef).
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: false
      # Parent-page doc store bucket; lifespan ensure_bucket creates it in MinIO.
      PAGE_BUCKET: parent-pages
      DEBUG: true
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "10000"
    networks:
      - default
  # ---------------------------------------------------------------------------
  # Enterprise
  # ---------------------------------------------------------------------------
  backend-enterprise-data-sources:
    profiles: [enterprise]
    image: artemis/backend-data-sources:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    depends_on:
      postgres:
        condition: service_healthy
      artemis-db-migrations:
        condition: service_completed_successfully
      kafka-connect:
        condition: service_healthy
      backend-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9500 && printf 'GET /health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      SQL_DB_URL: "postgresql+asyncpg://postgres:testpass@postgres:5432/documents"
      KAFKA_CONNECT_URL: "http://kafka-connect:8083"
      STORAGE_SERVICE_URL: "http://backend-storage:7000"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    expose:
      - "9500"
    networks:
      - default
  artemis-ksqldb-init:
    profiles: [backend, enterprise]
    image: artemis/ksqldb-init:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    container_name: artemis-ksqldb-init
    depends_on:
      ksqldb-server:
        condition: service_healthy
    restart: "no"
    environment:
      KSQLDB_SERVER_URL: http://ksqldb-server:8088
    networks:
      - default
  ksqldb-enterprise-init:
    profiles: [enterprise]
    image: artemis/ksqldb-enterprise-init:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    container_name: ksqldb-enterprise-init
    depends_on:
      ksqldb-server:
        condition: service_healthy
      artemis-ksqldb-init:
        condition: service_completed_successfully
    restart: "no"
    environment:
      KSQLDB_SERVER_URL: http://ksqldb-server:8088
    networks:
      - default
  artemis-kafka-connect-init:
    profiles: [enterprise]
    image: artemis/cp-kafka-connect-init:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    container_name: artemis-kafka-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
      ksqldb-enterprise-init:
        condition: service_completed_successfully
    restart: "no"
    environment:
      KAFKA_CONNECT_CLUSTER_URI: http://kafka-connect:8083
    networks:
      - default
  backend-enterprise-intake:
    profiles: [enterprise]
    image: artemis/backend-enterprise-intake:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    depends_on:
      backend-storage:
        condition: service_healthy
    volumes:
      - ${ARTEMIS_WATCH_DIR:-/tmp/artemis-e2e-watch}:/watch:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      KAFKA_CONNECT_URL: "http://kafka-connect:8083"
      STORAGE_SERVICE_URL: "http://backend-storage:7000"
      INTAKE_URL: "http://backend-enterprise-intake:9000/intake"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    expose:
      - "9000"
    networks:
      - default
  kafka-connect:
    profiles: [enterprise]
    image: artemis/cp-kafka-connect:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    container_name: kafka-connect
    depends_on:
      - broker
      - schemaregistry
    volumes:
      - ${ARTEMIS_WATCH_DIR:-/tmp/artemis-e2e-watch}:/watch:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "broker:9092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schemaregistry:8081"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_LOG4J_APPENDER_STDOUT_LAYOUT_CONVERSIONPATTERN: "[%d] %p %X{connector.context}%m (%c:%L)%n"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/data/connect-jars
    networks:
      - default
  ksqldb-server:
    profiles: [enterprise, backend]
    image: confluentinc/cp-ksqldb-server:7.9.1
    hostname: ksqldb-server
    container_name: ksqldb-server
    depends_on:
      - broker
      - kafka-connect
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/healthcheck || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      KSQL_CONFIG_DIR: "/etc/ksql"
      KSQL_BOOTSTRAP_SERVERS: "broker:9092"
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: "http://0.0.0.0:8088"
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0
      KSQL_KSQL_SCHEMA_REGISTRY_URL: "http://schemaregistry:8081"
      KSQL_KSQL_CONNECT_URL: "http://kafka-connect:8083"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
    networks:
      - default
  # ---------------------------------------------------------------------------
  # AI
  # ---------------------------------------------------------------------------
  docling-model-downloader:
    profiles: [ai]
    image: "ghcr.io/docling-project/docling-serve-cu128:v1.29.0"
    container_name: docling-model-downloader
    user: "0"
    entrypoint: /opt/app-root/bin/docling-tools
    command:
      - models
      - download
      - --output-dir
      - /mnt/models
    environment:
      HF_HUB_OFFLINE: "${IS_AIR_GAPPED:-0}"
    volumes:
      - docling-models:/mnt/models
    restart: "no"
    networks:
      - default
  tei-model-downloader:
    profiles: [ai-tei]
    image: "huggingface/downloader:0.17.3-esgz"
    container_name: tei-model-downloader
    user: "0"
    entrypoint: /usr/local/bin/huggingface-cli
    command:
      - download
      - "Alibaba-NLP/gte-large-en-v1.5"
      - --resume-download
    environment:
      HUGGINGFACE_HUB_CACHE: /mnt/models
      HF_HUB_OFFLINE: "${IS_AIR_GAPPED:-0}"
      HF_HUB_DOWNLOAD_TIMEOUT: "3600"
    volumes:
      - tei-models:/mnt/models
    restart: "no"
    networks:
      - default
  colbert-model-downloader:
    profiles: [ai-colbert]
    image: "vllm/vllm-openai:v0.20.2"
    container_name: colbert-model-downloader
    user: "0"
    entrypoint: python3
    command:
      - -c
      - "from huggingface_hub import snapshot_download; from transformers import AutoConfig; p = snapshot_download('jinaai/jina-colbert-v2', resume_download=True); AutoConfig.from_pretrained(p, trust_remote_code=True)"
    environment:
      HF_HOME: /mnt/models
      HF_HUB_OFFLINE: "${IS_AIR_GAPPED:-0}"
      HF_HUB_DOWNLOAD_TIMEOUT: "3600"
    volumes:
      - colbert-models:/mnt/models
    restart: "no"
    networks:
      - default
  docling-serve:
    profiles: [ai]
    image: "ghcr.io/docling-project/docling-serve-cu128:v1.29.0"
    container_name: docling-serve
    healthcheck:
      test: wget http://localhost:5001/health || exit 1
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 30s
    volumes:
      - docling-models:/mnt/models
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_MAX_SYNC_WAIT: 12
      DOCLING_SERVE_ARTIFACTS_PATH: /mnt/models
      HF_HUB_OFFLINE: "${IS_AIR_GAPPED:-0}"
      NVIDIA_VISIBLE_DEVICES: "all" # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/docker-specialized.html
    deploy: # This section is for compatibility with Swarm
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    depends_on:
      docling-model-downloader:
        condition: service_completed_successfully
    restart: always
    networks:
      - default
  tei:
    profiles: [ai-tei]
    image: "ghcr.io/huggingface/text-embeddings-inference:1.6"
    # TEI native OTel tracing — extracts the incoming traceparent so embedding
    # spans nest under the caller's trace. The --otlp-* flags are appended only
    # when OTEL_EXPORTER_OTLP_ENDPOINT is set (i.e. the observability profile is
    # up). compose resolves ${VAR:+...} at parse time, so when it's unset TEI
    # starts with no exporter and emits no warnings.
    command: "--model-id Alibaba-NLP/gte-large-en-v1.5 --pooling mean --auto-truncate${OTEL_EXPORTER_OTLP_ENDPOINT:+ --otlp-endpoint http://otel-collector:4317 --otlp-service-name tei}"
    container_name: tei
    volumes:
      - tei-models:/mnt/models
    environment:
      HF_ENDPOINT: "https://huggingface.co"
      HUGGINGFACE_HUB_CACHE: /mnt/models
      HF_HUB_OFFLINE: "${IS_AIR_GAPPED:-0}"
    depends_on:
      tei-model-downloader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 300s
    deploy: # This section is for compatibility with Swarm
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - default
  colbert:
    profiles: [ai-colbert]
    image: "vllm/vllm-openai:v0.20.2" # ColBERT late-interaction model
    # Wrap the image's `vllm serve` entrypoint so the OTel flag can be appended
    # only when OTEL_EXPORTER_OTLP_ENDPOINT is set (observability profile up).
    # compose resolves ${VAR:+...} at parse time; $$@ becomes the literal $@ that
    # forwards the model + flags from the command list below. vLLM's
    # --otlp-traces-endpoint is gated by `is not None`, so a list-form item can't
    # be conditionally omitted — hence the wrapper.
    entrypoint:
      - /bin/sh
      - -c
      - 'exec vllm serve "$$@"${OTEL_EXPORTER_OTLP_ENDPOINT:+ --otlp-traces-endpoint http://otel-collector:4317}'
      - vllm
    command:
      - jinaai/jina-colbert-v2
      - --pooler-config.task
      - token_embed
      - --hf-overrides
      - '{"architectures": ["ColBERTJinaRobertaModel"]}'
      - --trust-remote-code
      - --gpu-memory-utilization
      - '0.10'
    container_name: colbert
    volumes:
      - colbert-models:/mnt/models
    environment:
      # Standard OTel SDK var (not vLLM-specific) — names vLLM's spans 'colbert'
      # in Jaeger via the SDK's resource detector. Inert when
      # OTEL_EXPORTER_OTLP_ENDPOINT is unset: no tracer is built, so the resource
      # is never created and this is never read (default would be unknown_service).
      OTEL_SERVICE_NAME: colbert
      HF_HOME: /mnt/models
      HF_HUB_OFFLINE: "${IS_AIR_GAPPED:-0}"
    depends_on:
      colbert-model-downloader:
        condition: service_completed_successfully
    shm_size: "10g"
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 300s
    deploy: # This section is for compatibility with Swarm
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - default
  backend-mcp:
    profiles: [mcp]
    image: artemis/backend-mcp:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    depends_on:
      backend-storage:
        condition: service_healthy
      backend-indexing-ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/11000 && printf 'GET /health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      STORAGE_SERVICE_URL: "http://backend-storage:7000"
      INDEXING_SERVICE_URL: "http://backend-indexing-ingestion:10000"
      ENABLE_UPLOAD: "${MCP_ENABLE_UPLOAD:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    expose:
      - "11000"
    networks:
      - default
  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.154.0
    configs:
      - source: otel-collector-config
        target: /etc/otelcol-contrib/config.yaml
    depends_on:
      - jaeger
    networks:
      - default
  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.19.0
    configs:
      - source: jaeger-config
        target: /etc/jaeger/config.yaml
    command: ["--config", "/etc/jaeger/config.yaml"]
    networks:
      - default
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.0.0
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    networks:
      - default
  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  apisix-etcd:
    profiles: [gateway]
    image: gcr.io/etcd-development/etcd:v3.5.18
    container_name: apisix-etcd
    command: >
      etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://apisix-etcd:2379 --data-dir /tmp/etcd

    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "2379"
    networks:
      - default
  apisix:
    profiles: [gateway]
    image: apache/apisix:3.16.0-debian
    container_name: apisix
    depends_on:
      apisix-etcd:
        condition: service_healthy
    configs:
      - source: apisix-config
        target: /usr/local/apisix/conf/config.yaml
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9090 && printf 'GET /v1/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "9080:9080"
    networks:
      - default
  artemis-apisix-init:
    profiles: [gateway]
    image: artemis/apisix-init:${ARTEMIS_VERSION:?set ARTEMIS_VERSION to a release tag}
    container_name: artemis-apisix-init
    depends_on:
      apisix:
        condition: service_healthy
    environment:
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: artemis-apisix-admin-key
    networks:
      - default
networks:
  default:
    driver: bridge
volumes:
  qdrant-vectorstore:
  db-storage:
  s3-storage:
  docling-models:
  tei-models:
  colbert-models:
configs:
  rabbitmq-conf:
    content: |
      # 30-minute consumer timeout. Aligned to HTTPX_TIMEOUT (1800s) for the
      # blocking indexing call (TEI embed + Qdrant write for large documents).
      consumer_timeout = 1800000
  jaeger-config:
    content: |
      service:
        extensions: [jaeger_storage, jaeger_query]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [jaeger_storage_exporter]
      extensions:
        jaeger_storage:
          backends:
            memstore:
              memory:
                max_traces: 100000
        jaeger_query:
          storage:
            traces: memstore
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch:
      exporters:
        jaeger_storage_exporter:
          trace_storage: memstore
  otel-collector-config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      exporters:
        otlp_grpc/jaeger:
          endpoint: jaeger:4317
          tls:
            insecure: true
        prometheus:
          endpoint: 0.0.0.0:8889
          namespace: artemis
      service:
        pipelines:
          traces:
            receivers: [otlp]
            exporters: [otlp_grpc/jaeger]
          metrics:
            receivers: [otlp]
            exporters: [prometheus]
  prometheus-config:
    content: |
      scrape_configs:
        - job_name: artemis
          static_configs:
            - targets: ['otel-collector:8889']
  apisix-config:
    content: |
      deployment:
        role: traditional
        traditional:
          config_provider: etcd
        etcd:
          host:
            - "http://apisix-etcd:2379"
          prefix: /apisix
          timeout: 30
        admin:
          admin_key_required: true
          admin_key:
            - name: admin
              key: artemis-apisix-admin-key
              role: admin
          allow_admin:
            - 0.0.0.0/0
          admin_listen:
            ip: 0.0.0.0
            port: 9180
      apisix:
        node_listen: 9080
        enable_control: true
        control:
          ip: "0.0.0.0"
          port: 9090
