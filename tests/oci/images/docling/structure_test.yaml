schemaVersion: "2.0.0"

fileExistenceTests:
  - name: "patched ray orchestrator models.py is present"
    path: "/opt/app-root/lib64/python3.12/site-packages/docling_jobkit/orchestrators/ray/models.py"
    shouldExist: true

fileContentTests:
  - name: "SourceChunkConvertRequest.chunk is the bare DocumentChunk, not the unpicklable DocumentChunk[Any, Any]"
    path: "/opt/app-root/lib64/python3.12/site-packages/docling_jobkit/orchestrators/ray/models.py"
    expectedContents: ['chunk: DocumentChunk = Field\(']
    # Anchored to the actual field declaration, not just the phrase -- the fix's
    # own explanatory comment legitimately mentions "DocumentChunk[Any, Any]" as
    # prose, which a bare substring match would (and did) false-positive on.
    excludedContents: ['chunk: DocumentChunk\[Any, Any\] = Field\(']
