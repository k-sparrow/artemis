[pytest]
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: marks tests that require real infrastructure (testcontainers, Docker)
    e2e: marks end-to-end tests (requires all services running, use --e2e flag)
    local: marks tests that require host-path Docker volume mounts (incompatible with Bazel linux-sandbox; use --local flag)